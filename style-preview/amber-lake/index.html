  for(let i=0;i<910;i++){const x=random()*W,y=random()*H;if(!inLake(x,y)&&line.every((q,j)=>j%4!==0||distance([x,y],q)>25)&&stops.every(s=>distance([x,y],loc(s))>48))pine(x,y,.27+random()*.68);}
  function lakeShape(scale,fill){const path=[];for(let a=0;a<Math.PI*2;a+=.025){const r=lakeRadius(a)*scale;path.push([lake.x+Math.cos(a)*lake.rx*r,lake.y+Math.sin(a)*lake.ry*r]);}poly(g,path,fill);}
  lakeShape(1.066,"#91ac84");lakeShape(1.035,"#ece0b1");lakeShape(1.015,"#9ac5b2");
  const water=g.createLinearGradient(330,200,670,500);water.addColorStop(0,"#76b4b0");water.addColorStop(.55,"#519697");water.addColorStop(1,"#327c81");lakeShape(1,water);
  for(let i=0;i<420;i++){const x=230+random()*590,y=158+random()*320;if(!inLake(x-9,y)||!inLake(x+9,y))continue;g.strokeStyle=random()>.5?"#e9e5b475":"#25777b66";g.lineWidth=random()*1.5+.5;g.beginPath();g.moveTo(x-3,y);g.lineTo(x+2+random()*12,y);g.stroke();}
  g.save();g.translate(509,309);g.rotate(-.065);g.fillStyle="#e0eece";g.textAlign="center";g.font="italic 44px Georgia,serif";g.fillText("Amber Lake",0,0);g.font="16px sans-serif";g.fillText("琥  珀  湖",0,27);g.restore();
  traceRoad("#869c7b",31);traceRoad("#c9b88a",26);traceRoad("#f3dea7",21);g.setLineDash([7,10]);traceRoad("#b99e70",1.4);g.setLineDash([]);
  function house(x,y,color,s){g.save();g.translate(x,y);g.scale(s,s);poly(g,[[0,0],[17,-7],[30,-1],[13,7]],"#c3b594");poly(g,[[0,-3],[0,-16],[15,-12],[15,2]],"#f7e4bb");poly(g,[[15,2],[15,-12],[25,-17],[25,-3]],"#c0aa7c");poly(g,[[-3,-16],[6,-27],[18,-24],[28,-16],[15,-10]],color);g.fillStyle="#586956";g.fillRect(6,-9,3,7);g.restore();}
  const roof=["#bd714c","#b45a3d","#788c96","#9d5b3d"];
  stops.forEach((s,i)=>{const [x,y]=loc(s),v=y<300?-1:1;house(x-13,y+v*23,roof[i%4],.85);if(i%2===0)house(x+9,y+v*28,roof[(i+1)%4],.7);});
  let car={x:0,y:0,angle:0,speed:0},goal=null,route=[],pressed=new Set(),last=0,frame=0,nearby=null;
  const cruise=document.querySelector("#cruise"),nearName=document.querySelector("#station-name"),status=document.querySelector("#station-status"),enter=document.querySelector("#station-link");
  const chooser=document.createElement("select");chooser.setAttribute("aria-label","选择自动驾驶目的地");chooser.className="destinations";
  chooser.add(new Option("选择目的地",""));stops.forEach((s,i)=>chooser.add(new Option(s.p.place+" · "+s.p.title,String(i))));document.querySelector(".controls-tip").before(chooser);
  const pedalButtons=[...document.querySelectorAll("[data-key]")];
  function reset(){const [x,y]=loc(stops[0]);car={x,y,angle:Math.atan2(line[3][1]-y,line[3][0]-x),speed:0};last=0;stopAuto();updateStation();}
  function stopAuto(){goal=null;route=[];cruise.textContent="沿路巡游";cruise.setAttribute("aria-pressed","false");chooser.value="";}
  function startAuto(stop){stopAuto();let from=0;line.forEach((p,i)=>{if(distance(p,[car.x,car.y])<distance(line[from],[car.x,car.y]))from=i;});
    const end=stop.k*24, n=line.length, forward=(end-from+n)%n,back=(from-end+n)%n,dir=forward<=back?1:-1,steps=Math.min(forward,back);
    route=[line[from]];for(let i=1;i<=steps;i++)route.push(line[(from+dir*i+n)%n]);goal=stop;chooser.value=String(stops.indexOf(stop));cruise.textContent="停止巡游";cruise.setAttribute("aria-pressed","true");car.speed=0;updateStation();}
  function updateStation(){const p=[car.x,car.y];let best=stops[0];for(const s of stops)if(distance(p,loc(s))<distance(p,loc(best)))best=s;
    nearby=distance(p,loc(best))<39?best:null;const label=goal?"正在驶向":nearby?"已经到站":"沿湖行驶";const title=goal?goal.p.place:nearby?nearby.p.title:"湖畔公路";
    if(status.textContent!==label)status.textContent=label;if(nearName.textContent!==title)nearName.textContent=title;
    enter.hidden=!!goal||!nearby;if(!enter.hidden)enter.href=new URL(nearby.p.url,originSite);}
  function update(dt){if(goal){let budget=142*dt;while(route.length&&budget>0){const p=route[0],dx=p[0]-car.x,dy=p[1]-car.y,d=Math.hypot(dx,dy);if(d>.2)car.angle=Math.atan2(dy,dx);if(d<=budget){car.x=p[0];car.y=p[1];budget-=d;route.shift();}else{car.x+=dx/d*budget;car.y+=dy/d*budget;budget=0;}}if(!route.length)stopAuto();}
    else{const accel=(pressed.has("ArrowUp")?1:0)-(pressed.has("ArrowDown")?1:0);const turn=(pressed.has("ArrowRight")?1:0)-(pressed.has("ArrowLeft")?1:0);
      car.speed=cap(car.speed+accel*136*dt,-63,155);if(!accel)car.speed*=Math.exp(-2.4*dt);car.angle+=turn*2.25*dt*(car.speed< -2?-1:1);
      const nx=cap(car.x+Math.cos(car.angle)*car.speed*dt,12,W-12),ny=cap(car.y+Math.sin(car.angle)*car.speed*dt,12,H-12);if(!inLake(nx,ny)){car.x=nx;car.y=ny;}else car.speed*=-.2;}
    updateStation();}
  function draw(){ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.drawImage(background,0,0,W,H);
    stops.forEach((s,i)=>{const [x,y]=loc(s),active=nearby===s||goal===s;circle(ctx,x,y,active?12:9,active?"#f4c76e":"#f1e6bf");circle(ctx,x,y,active?7:5,active?"#a94e36":"#606d4d");
      let tx=x+(x>840?-10:10),ty=y+(s.k===0?33:s.k===2?-13:s.k===3?31:s.k===15?32:-14);ctx.font="bold 15px sans-serif";ctx.textAlign=x>840?"right":"left";ctx.lineWidth=4;ctx.strokeStyle="#f4efd6";ctx.lineJoin="round";ctx.strokeText(s.p.place,tx,ty);ctx.fillStyle="#263e36";ctx.fillText(s.p.place,tx,ty);});
    ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.angle);ctx.fillStyle="#152d2755";ctx.fillRect(-11,-4,26,14);ctx.fillStyle="#263a35";ctx.fillRect(-8,-9,6,4);ctx.fillRect(6,-9,6,4);ctx.fillRect(-8,5,6,4);ctx.fillRect(6,5,6,4);
    ctx.fillStyle="#ffc563";ctx.fillRect(-13,-6.5,27,13);ctx.fillStyle="#aa5939";ctx.fillRect(-7,-5.5,14,11);ctx.fillStyle="#d5eadc";ctx.fillRect(3,-5,4,10);ctx.fillStyle="#715546";ctx.fillRect(-7,-5,3,10);ctx.fillStyle="#fff1b2";ctx.fillRect(12,-5,3,3);ctx.fillRect(12,2,3,3);ctx.restore();}
  function loop(time){if(!dialog.open)return;const dt=Math.min((time-(last||time))/1000,.05);last=time;update(dt);draw();frame=requestAnimationFrame(loop);}
  function clearKeys(){pressed.clear();pedalButtons.forEach(b=>b.classList.remove("active"));}
  function setKey(key,on){if(on){if(goal)stopAuto();pressed.add(key);}else pressed.delete(key);const b=pedalButtons.find(p=>p.dataset.key===key);if(b)b.classList.toggle("active",on);}
  const keys={w:"ArrowUp",a:"ArrowLeft",s:"ArrowDown",d:"ArrowRight",ArrowUp:"ArrowUp",ArrowLeft:"ArrowLeft",ArrowDown:"ArrowDown",ArrowRight:"ArrowRight"};
  window.addEventListener("keydown",e=>{if(!dialog.open||e.target===chooser||e.altKey||e.metaKey||e.ctrlKey)return;const k=keys[e.key]||keys[e.key.toLowerCase()];if(k){e.preventDefault();setKey(k,true);}});
  window.addEventListener("keyup",e=>{const k=keys[e.key]||keys[e.key.toLowerCase()];if(k&&dialog.open)setKey(k,false);});window.addEventListener("blur",clearKeys);
  pedalButtons.forEach(b=>{b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture(e.pointerId);setKey(b.dataset.key,true);});for(const ev of ["pointerup","pointercancel","lostpointercapture"])b.addEventListener(ev,()=>setKey(b.dataset.key,false));});
  function fitCanvas(){const box=canvas.getBoundingClientRect(),ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(box.width*ratio));canvas.height=Math.max(1,Math.round(box.height*ratio));draw();}
  canvas.addEventListener("click",e=>{const b=canvas.getBoundingClientRect(),p=[(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height];let best=stops[0];for(const s of stops)if(distance(p,loc(s))<distance(p,loc(best)))best=s;if(distance(p,loc(best))<48)startAuto(best);});
  chooser.addEventListener("change",()=>{if(chooser.value!=="")startAuto(stops[Number(chooser.value)]);else stopAuto();});
  cruise.addEventListener("click",()=>{if(goal){stopAuto();return;}let i=0;stops.forEach((s,j)=>{if(distance([car.x,car.y],loc(s))<distance([car.x,car.y],loc(stops[i])))i=j;});startAuto(stops[(i+1)%stops.length]);});
  document.querySelector("#open-drive").addEventListener("click",()=>{dialog.showModal();document.body.classList.add("driving");reset();fitCanvas();canvas.focus({preventScroll:true});frame=requestAnimationFrame(loop);});
  document.querySelector("#exit-drive").addEventListener("click",()=>dialog.close());
  dialog.addEventListener("close",()=>{cancelAnimationFrame(frame);clearKeys();stopAuto();document.body.classList.remove("driving");document.querySelector("#open-drive").focus({preventScroll:true});});
  window.addEventListener("resize",()=>{if(dialog.open)fitCanvas();});
})();
