<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203b32"><title>绕湖路线实验室 · Mingxuan</title><link rel="stylesheet" href="lab.css"></head><body><header><div class="top"><a class="brand" href="../"><b aria-hidden="true">◢</b> Mingxuan 的作品集</a><a class="back" href="../#experiments">全部实验</a></div></header><main><div class="intro"><h1>绕湖路线实验室</h1><p>从母港出发，自选七个航标的经过顺序。规划好一圈后，把这条路线带进《琥珀湖飞行》试飞。</p></div><div class="desk"><section class="scene" aria-label="实验区"><canvas id="map" class="plot" aria-label="八个航标的位置与当前航线，可在图下选点"></canvas><p class="legend">航标位置取自飞行游戏。虚线表示回到母港的一段，水岸为示意图。</p><h2>选择下一个航标</h2><div class="chips" id="marks"></div></section><aside class="tools" aria-label="实验控制"><div><h2>航线顺序</h2><p class="step-list" id="order"></p></div><dl id="stats" class="stats"></dl><div class="controls"><button id="undo" class="btn">撤回一站</button><button class="btn" id="clear">重新规划</button><button class="btn" id="standard">原版环湖</button><button class="btn" id="optimal">最短环线</button></div><a class="btn primary" id="fly" style="text-align:center;text-decoration:none" href="../">按此路线试飞</a><p id="status" class="status" role="status"></p></aside></div></main><footer class="bottom"><a href="../#experiments">返回作品集</a></footer><script src="core.js"></script><script src="lake.js"></script></body></html>
