<!DOCTYPE html>

<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#203b32" name="theme-color"/><title>绕湖路线实验室 · Mingxuan</title><link href="lab.css" rel="stylesheet"/><link href="studio.css" rel="stylesheet"/></head><body class="studio-lab lake" style="--project-ink:#216c62;--project-paper:#e0e9d8"><header class="studio-head"><div class="studio-bar"><a class="studio-brand" href="../"><span aria-hidden="true" class="seal">m</span><strong>Mingxuan</strong><span class="brand-tail">作品集</span></a><a class="back" href="../#experiments">全部实验</a></div></header><main><div class="intro"><div class="lab-intro-copy"><h1>绕湖路线实验室</h1><p>从母港出发，自选七个航标的经过顺序。规划好一圈后，把这条路线带进《琥珀湖飞行》试飞。</p></div><div class="lab-print"><img alt="" height="338" src="../media/lake.webp" width="764"/></div></div><div class="desk"><section aria-label="实验区" class="scene"><canvas aria-label="八个航标的位置与当前航线，可在图下选点" class="plot" id="map"></canvas><p class="legend">航标位置取自飞行游戏。虚线表示回到母港的一段，水岸为示意图。</p><h2>选择下一个航标</h2><div class="chips" id="marks"></div></section><aside aria-label="实验控制" class="tools"><div><h2>航线顺序</h2><p class="step-list" id="order"></p></div><dl class="stats" id="stats"></dl><div class="controls"><button class="btn" id="undo">撤回一站</button><button class="btn" id="clear">重新规划</button><button class="btn" id="standard">原版环湖</button><button class="btn" id="optimal">最短环线</button></div><a class="btn primary" href="../" id="fly" style="text-align:center;text-decoration:none">按此路线试飞</a><p class="status" id="status" role="status"></p></aside></div></main><footer class="bottom"><a href="../#experiments">返回作品集</a></footer><script src="core.js"></script><script src="lake.js"></script></body></html>
