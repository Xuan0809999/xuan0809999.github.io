<!DOCTYPE html>

<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#203b32" name="theme-color"/><title>手势指挥鹈鹕骑车 · Mingxuan</title><link href="lab.css" rel="stylesheet"/><link href="studio.css" rel="stylesheet"/><link rel="stylesheet" href="../media/nightfall/desks.css"></head><body class="studio-lab pelican" style="--project-ink:#276779;--project-paper:#dfeceb"><header class="studio-head"><div class="studio-bar"><a class="studio-brand" href="../"><span aria-hidden="true" class="seal">m</span><strong>Mingxuan</strong><span class="brand-tail">作品集</span></a><a class="back" href="../#experiments">全部实验</a></div></header><main><div class="intro"><div class="lab-intro-copy"><h1>手势指挥鹈鹕骑车</h1><p>沿海堤骑完 600 米。左右挥手换道，向上挥手跳过木箱，在三个车道里尽量多收集小鱼。</p></div><div class="lab-print"><img alt="" height="338" src="../media/nightfall/pelican.jpg" width="764"/></div></div><div class="desk"><section aria-label="实验区" class="scene"><div class="controls ride-start"><button class="btn primary" id="start">出发</button><button class="btn" disabled="" id="pause">暂停</button></div><canvas aria-label="鹈鹕骑车赛道，左右划换道，向上划跳跃" class="plot" id="ride" style="touch-action:none" tabindex="0"></canvas><div class="controls" style="margin-top:12px"><button class="btn" data-act="left">左移</button><button class="btn" data-act="jump">跳跃</button><button class="btn" data-act="right">右移</button></div><p class="legend">在画面里左划、右划或上划。键盘可用 ←、→、↑ 或空格。</p></section><aside aria-label="实验控制" class="tools"><dl class="stats" id="stats"></dl><p class="status" id="status" role="status"></p><div><h2>隔空手势（可选）</h2><p class="hint">在镜头左侧或右侧挥手换道，在上方中央挥手跳跃。放下手后再做下一个动作。</p><button class="btn" id="camera">开启摄像头</button><video hidden="" id="preview" muted="" playsinline="" style="width:100%;margin-top:8px;transform:scaleX(-1);border-radius:7px"></video><p class="small" id="cameraMsg" role="status">镜头画面只在本机用于检测动作。</p></div></aside></div></main><footer class="bottom"><a href="../#experiments">返回作品集</a></footer><script src="core.js"></script><script src="pelican.js"></script></body></html>
