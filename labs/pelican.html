<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203b32"><title>手势指挥鹈鹕骑车 · Mingxuan</title><link rel="stylesheet" href="lab.css"></head><body><header><div class="top"><a class="brand" href="../"><b aria-hidden="true">◢</b> Mingxuan 的作品集</a><a class="back" href="../#experiments">全部实验</a></div></header><main><div class="intro"><h1>手势指挥鹈鹕骑车</h1><p>沿海堤骑完 600 米。左右挥手换道，向上挥手跳过木箱，在三个车道里尽量多收集小鱼。</p></div><div class="desk"><section class="scene" aria-label="实验区"><canvas class="plot" id="ride" tabindex="0" style="touch-action:none" aria-label="鹈鹕骑车赛道，左右划换道，向上划跳跃"></canvas><div class="controls" style="margin-top:12px"><button class="btn" data-act="left">左移</button><button class="btn" data-act="jump">跳跃</button><button class="btn" data-act="right">右移</button></div><p class="legend">在画面里左划、右划或上划。键盘可用 ←、→、↑ 或空格。</p></section><aside class="tools" aria-label="实验控制"><div class="controls"><button id="start" class="btn primary">出发</button><button id="pause" class="btn" disabled>暂停</button></div><dl id="stats" class="stats"></dl><p id="status" class="status" role="status"></p><div><h2>隔空手势（可选）</h2><p class="hint">在镜头左侧或右侧挥手换道，在上方中央挥手跳跃。放下手后再做下一个动作。</p><button class="btn" id="camera">开启摄像头</button><video id="preview" muted playsinline hidden style="width:100%;margin-top:8px;transform:scaleX(-1);border-radius:7px"></video><p class="small" id="cameraMsg" role="status">镜头画面只在本机用于检测动作。</p></div></aside></div></main><footer class="bottom"><a href="../#experiments">返回作品集</a></footer><script src="core.js"></script><script src="pelican.js"></script></body></html>
