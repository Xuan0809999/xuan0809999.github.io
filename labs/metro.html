<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203b32"><title>迷你地铁调度员 · Mingxuan</title><link rel="stylesheet" href="lab.css"></head><body><header><div class="top"><a class="brand" href="../"><b aria-hidden="true">◢</b> Mingxuan 的作品集</a><a class="back" href="../#experiments">全部实验</a></div></header><main><div class="intro"><h1>迷你地铁调度员</h1><p>你有十四分钟调度海湾支线的两列车。看清每站乘客的去向，争取把十八个人送到目的地。</p></div><div class="desk"><section class="scene" aria-label="实验区"><canvas id="rail" class="plot" aria-label="海湾支线车站、列车和站台人数"></canvas><h2 style="margin-top:18px">站台客流</h2><div style="overflow:auto"><table style="width:100%;text-align:left;border-collapse:collapse"><thead><tr><th>车站</th><th>往海堤</th><th>往灯塔</th></tr></thead><tbody id="platforms"></tbody></table></div></section><aside class="tools" aria-label="实验控制"><div><h2>下一分钟</h2><p class="hint">为两列车各选一个方向，然后发车。每分钟走一站，每列限乘 6 人，同一区间同一分钟只能通过一列车。</p></div><label class="group" id="labelA">珊瑚号<select class="field" id="trainA"></select></label><label class="group" id="labelB">海青号<select class="field" id="trainB"></select></label><div class="controls"><button class="btn primary" id="tick">推进 1 分钟</button><button class="btn" id="new">重新值班</button></div><dl id="stats" class="stats"></dl><p id="status" class="status" role="status"></p></aside></div></main><footer class="bottom"><a href="../#experiments">返回作品集</a></footer><script src="core.js"></script><script src="metro.js"></script></body></html>
