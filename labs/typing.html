<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203b32"><title>打字节奏分析器 · Mingxuan</title><link rel="stylesheet" href="lab.css"></head><body><header><div class="top"><a class="brand" href="../"><b aria-hidden="true">◢</b> Mingxuan 的作品集</a><a class="back" href="../#experiments">全部实验</a></div></header><main><div class="intro"><h1>打字节奏分析器</h1><p>输入一段话，看看哪几次停顿拉长了你的节拍。</p></div><div class="desk"><section class="scene" aria-label="实验区"><h2>照着这段文字输入</h2><div id="sample" class="quote" aria-label="练习文本"></div><label class="group" for="pad">你的输入</label><textarea id="pad" class="field" autocomplete="off" spellcheck="false" placeholder="从第一个字开始，计时会自动启动"></textarea><h2 style="margin-top:22px">输入节拍</h2><canvas id="beat" class="plot" aria-label="最近 32 次击键之间的时间间隔"></canvas><p class="legend">每根线代表两次击键之间的间隔。金色表示超过一秒的停顿。</p></section><aside class="tools" aria-label="实验控制"><label class="group">练习语言<select class="field" id="language"><option value="zh">中文</option><option value="en">English</option></select></label><dl id="stats" class="stats"></dl><div class="controls"><button class="btn primary" id="finish">结束并分析</button><button class="btn" id="again">换一段</button></div><p id="status" class="status" role="status"></p><p class="hint">仅在下方输入框获得焦点时采集节拍。支持中文输入法，练习内容只在本页处理。</p></aside></div></main><footer class="bottom"><a href="../#experiments">返回作品集</a></footer><script src="core.js"></script><script src="typing.js"></script></body></html>
