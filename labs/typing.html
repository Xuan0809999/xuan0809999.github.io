<!DOCTYPE html>

<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#203b32" name="theme-color"/><title>打字节奏分析器 · Mingxuan</title><link href="lab.css" rel="stylesheet"/><link href="studio.css" rel="stylesheet"/></head><body class="studio-lab typing" style="--project-ink:#a13e20;--project-paper:#fae5cf"><header class="studio-head"><div class="studio-bar"><a class="studio-brand" href="../"><span aria-hidden="true" class="seal">m</span><strong>Mingxuan</strong><span class="brand-tail">作品集</span></a><a class="back" href="../#experiments">全部实验</a></div></header><main><div class="intro"><div class="lab-intro-copy"><h1>打字节奏分析器</h1><p>输入一段话，看看哪几次停顿拉长了你的节拍。</p></div><div class="lab-print"><img alt="" height="338" src="../media/typing.webp" width="764"/></div></div><div class="desk"><section aria-label="实验区" class="scene"><h2>照着这段文字输入</h2><div aria-label="练习文本" class="quote" id="sample"></div><label class="group" for="pad">你的输入</label><textarea autocomplete="off" class="field" id="pad" placeholder="从第一个字开始，计时会自动启动" spellcheck="false"></textarea><h2 style="margin-top:22px">输入节拍</h2><canvas aria-label="最近 32 次击键之间的时间间隔" class="plot" id="beat"></canvas><p class="legend">每根线代表两次击键之间的间隔。金色表示超过一秒的停顿。</p></section><aside aria-label="实验控制" class="tools"><label class="group">练习语言<select class="field" id="language"><option value="zh">中文</option><option value="en">English</option></select></label><dl class="stats" id="stats"></dl><div class="controls"><button class="btn primary" id="finish">结束并分析</button><button class="btn" id="again">换一段</button></div><p class="status" id="status" role="status"></p><p class="hint">仅在下方输入框获得焦点时采集节拍。支持中文输入法，练习内容只在本页处理。</p></aside></div></main><footer class="bottom"><a href="../#experiments">返回作品集</a></footer><script src="core.js"></script><script src="typing.js"></script></body></html>
