<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#203b32" name="theme-color"/><title>看图猜数据 · Mingxuan</title><link href="lab.css" rel="stylesheet"/><link href="studio.css" rel="stylesheet"/><link href="duo.css" rel="stylesheet"/></head><body class="studio-lab signals" style="--project-ink:#a24c29;--project-paper:#f6e4c8"><header class="studio-head"><div class="studio-bar"><a class="studio-brand" href="../"><span aria-hidden="true" class="seal">m</span><strong>Mingxuan</strong><span class="brand-tail">作品集</span></a><a class="back" href="../#experiments">全部实验</a></div></header><main><div class="intro"><div class="lab-intro-copy"><h1>看图猜数据</h1><p>食堂、巴士还是宿舍？读一天的曲线，找出藏在高峰里的线索。</p></div><div class="lab-print"><img alt="" height="315" src="../media/signals.webp" width="950"/></div></div><div class="desk"><section aria-label="实验区" class="scene"><div class="quiz-top"><span id="round"></span><span id="score"></span></div><h2 id="question">这条模拟曲线最像哪种数据？</h2><figure class="chart-frame"><canvas aria-label="一天内每小时的相对强度。可用下方滑块逐点读数。" id="signalPlot"></canvas><figcaption><label for="hour">逐点读数</label><input class="range" id="hour" max="24" min="0" step="1" type="range" value="12"/><output for="hour" id="reading"></output></figcaption></figure><div aria-labelledby="question" class="quiz-choices" id="options"></div></section><aside aria-label="实验控制" class="tools"><section aria-atomic="true" aria-live="polite" id="feedback"><h2 id="resultTitle">读图提示</h2><p id="resultText">先看一天中什么时候最忙，再看高峰是尖而短，还是宽而平。</p><ol id="clues"></ol></section><button class="btn primary" hidden="" id="nextRound" type="button">下一题</button><div class="source-note"><strong>数据说明</strong><p>本实验使用模拟曲线。纵轴为 0–100 的相对强度，方便比较形状。</p></div><section hidden="" id="recap"><h2>本轮回顾</h2><ol id="recapList"></ol></section></aside></div></main><footer class="bottom"><a href="../#experiments">返回作品集</a></footer><script src="core.js"></script><script src="
