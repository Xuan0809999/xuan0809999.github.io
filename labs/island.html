<!DOCTYPE html>

<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#203b32" name="theme-color"/><title>把名字种成一座岛 · Mingxuan</title><link href="lab.css" rel="stylesheet"/><link href="studio.css" rel="stylesheet"/><link href="duo.css" rel="stylesheet"/><link rel="stylesheet" href="../media/nightfall/desks.css"></head><body class="studio-lab island" style="--project-ink:#216657;--project-paper:#e2e9d5"><header class="studio-head"><div class="studio-bar"><a class="studio-brand" href="../"><span aria-hidden="true" class="seal">m</span><strong>Mingxuan</strong><span class="brand-tail">作品集</span></a><a class="back" href="../#experiments">全部实验</a></div></header><main><div class="intro"><div class="lab-intro-copy"><h1>把名字种成一座岛</h1><p>用一个名字生成海岸、森林和灯塔，把它保存成一张可以分享的明信片。</p></div><div class="lab-print"><img alt="" height="315" src="../media/nightfall/island.jpg" width="950"/></div></div><div class="desk"><section aria-label="实验区" class="scene"><figure class="island-frame"><canvas aria-label="名字生成的岛屿明信片" height="960" id="postcard" role="img" width="1440"></canvas></figure></section><aside aria-label="实验控制" class="tools"><form id="nameForm"><label class="group" for="islandName">给岛屿一个名字</label><input aria-describedby="nameHint" autocomplete="off" class="field" id="islandName" maxlength="48" name="name" placeholder="中文或英文，例如 Mingxuan" type="text" value="Mingxuan"/><p class="hint" id="nameHint">名字决定海岸线、树群和灯塔的位置。同一个名字会长出同一座岛。</p><button class="btn primary" type="submit">生成我的岛</button></form><section class="island-info"><h2 id="islandTitle"></h2><p id="islandFacts"></p></section><a aria-disabled="true" class="btn" download="" id="saveCard">保存明信片 PNG</a><p class="status" id="saveStatus" role="status">可以直接保存，也可以先换个名字。</p></aside></div></main><footer class="bottom"><a href="../#experiments">返回作品集</a></footer><script src="core.js"></script><script src="island.js?v=postcard2"></script></body></html>
