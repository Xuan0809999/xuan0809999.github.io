name: Check the standalone style samples and live projects
on:
  push:
    branches: ['qa/labs-29873564']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Exercise the six public projects in Chrome
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(fc-list :lang=zh family)" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk; fi
          python3 -m venv "$RUNNER_TEMP/lab-browser"
          "$RUNNER_TEMP/lab-browser/bin/pip" -q install selenium pillow
          export DRIVER="$(command -v chromedriver)"
          "$RUNNER_TEMP/lab-browser/bin/python" - <<'PYTHON'
          import os, time, tempfile, pathlib, struct, base64, io
          from PIL import Image
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          home='https://xuan0809999.github.io/'
          o=Options()
          for a in ['--headless=new','--no-sandbox','--window-size=1280,960','--use-angle=swiftshader','--enable-unsafe-swiftshader','--use-fake-device-for-media-stream','--use-fake-ui-for-media-stream','--autoplay-policy=no-user-gesture-required']:
              o.add_argument(a)
          o.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          o.add_experimental_option('prefs',{'download.prompt_for_download':False,'download.directory_upgrade':True})
          d=webdriver.Chrome(service=Service(os.environ['DRIVER']),options=o)
          w=WebDriverWait(d,35)
          def find(sel):return d.find_element(By.CSS_SELECTOR,sel)
          def click(sel):
              n=find(sel)
              d.execute_script("arguments[0].scrollIntoView({behavior:'instant',block:'center'})",n)
              n.click()
          def page(name):
              d.get(home+'labs/'+name+'.html')
              assert find('h1').text and d.execute_script('return document.documentElement.scrollWidth<=innerWidth')
          try:
              d.get(home+'style-preview/')
              w.until(lambda _:len(d.find_elements(By.CSS_SELECTOR,'.look-hit'))==5)
              d.set_window_size(1170,900)
              w.until(lambda _: d.execute_script("return document.querySelector('.mini').getBoundingClientRect().width>200 && document.querySelector('.mini').getBoundingClientRect().width<500"))
              # Capture the actual style chooser for the handoff.
              time.sleep(.45)
              shot=Image.open(io.BytesIO(d.get_screenshot_as_png())).convert('RGB')
              bottom=d.execute_script("return Math.ceil(document.getElementById('overview').getBoundingClientRect().bottom+13)")
              shot=shot.crop((0,0,shot.width,min(shot.height,bottom)))
              shot.thumbnail((1050,760))
              buf=io.BytesIO()
              shot.save(buf,format='WEBP',quality=72)
              screenshot=base64.b64encode(buf.getvalue()).decode('ascii')
              for offset in range(0,len(screenshot),6000):
                  print('SAMPLE_CAPTURE '+screenshot[offset:offset+6000],flush=True)
              for width in (1170,375):
                  d.set_window_size(width,850)
                  for variant in 'abcde':
                      print('Opening',variant,width,flush=True)
                      click('nav [data-view="'+variant+'"]')
                      w.until(lambda _:d.current_url.endswith('#'+variant))
                      w.until(lambda _:d.execute_script("return !document.querySelector('#frame').hidden && document.querySelector('#overview').hidden && document.querySelector('#reference h1')?.textContent.startsWith(arguments[0])", variant.upper()))
                      assert d.execute_script("return document.documentElement.scrollWidth<=innerWidth"),d.execute_script("return [...document.querySelectorAll('#stage *')].filter(el=>el.getBoundingClientRect().right>innerWidth).slice(0,15).map(el=>[el.tagName,el.className,el.getBoundingClientRect().right])")
                      assert len(d.find_elements(By.CSS_SELECTOR,'#reference a'))==2
                      assert len(d.find_elements(By.CSS_SELECTOR,'#stage a[href]'))>=10, len(d.find_elements(By.CSS_SELECTOR,'#stage a[href]'))
                  field=find('#stage input')
                  field.send_keys('help')
                  click('#stage form button')
                  assert '列出项目' in find('#stage output').text
                  click('nav [data-view="all"]')
                  w.until(lambda _:find('#overview').is_displayed())
              click('.look-hit[href="#e"]')
              w.until(lambda _:find('#stage input').is_displayed())
              find('#stage input').send_keys('open island')
              click('#stage form button')
              w.until(lambda _:d.current_url.endswith('/labs/island.html'))
              print('PASS all five samples on desktop and mobile, reference links, and terminal game entry',flush=True)
              d.get(home)
              w.until(lambda _:len(d.find_elements(By.CSS_SELECTOR,'.experiment-card'))==8)
              for width in (375, 1280):
                  d.set_window_size(width, 900)
                  assert d.execute_script("return document.documentElement.scrollWidth<=window.innerWidth")
                  assert d.execute_script("const i=document.querySelector('.poster-art img');return !!i && i.naturalWidth>0 && i.clientWidth>160")
                  for cover in d.find_elements(By.CSS_SELECTOR,'.project-print'):
                      d.execute_script("arguments[0].scrollIntoView({behavior:'instant',block:'center'})",cover)
                      w.until(lambda _:d.execute_script('return arguments[0].naturalWidth>0', cover))
                  assert len(d.find_elements(By.CSS_SELECTOR,'.project-print'))==8
              print('PASS responsive homepage and eight illustrations', flush=True)
              click('.try-time');click('#secondPad');click('#secondPad')
              assert '2 / 10' in find('#secondRound').text
              click('.course-link')
              assert find('#notes-title').text=='Field notes' and find('.studio-brand').is_displayed()
              d.get(home)
              click('a[data-art="signals"]')
              for round_index in range(6):
                  choices=d.find_elements(By.CSS_SELECTOR,'#options button')
                  assert len(choices)==3 and choices[0].is_enabled()
                  click('#options button')
                  assert len(d.find_elements(By.CSS_SELECTOR,'#clues li'))==2
                  assert len(d.find_elements(By.CSS_SELECTOR,'#options button:disabled'))==3
                  click('#nextRound')
              assert find('#recap').is_displayed() and len(d.find_elements(By.CSS_SELECTOR,'#recapList li'))==6
              click('#nextRound')
              assert not find('#recap').is_displayed() and find('#options button').is_enabled()
              print('PASS six data mysteries, annotated reveals and replay',flush=True)
              page('island')
              def postcard():
                  return d.execute_script("return document.getElementById('postcard').toDataURL('image/png')")
              def plant(s):
                  field=find('#islandName')
                  field.clear()
                  field.send_keys(s)
                  click('#nameForm button')
              def pixels(encoded):
                  return Image.open(io.BytesIO(base64.b64decode(encoded.split(',')[1]))).convert('RGB')
              def compare(first_img, second_img, label):
                  from PIL import ImageChops, ImageStat
                  difference=ImageChops.difference(first_img,second_img)
                  error=ImageStat.Stat(difference).mean
                  print(label, 'mean channel errors',error,'bbox',difference.getbbox(),flush=True)
                  return max(error)<0.25
              first=postcard()
              print('initial name',find('#islandTitle').text,flush=True)
              plant('琥珀')
              assert postcard()!=first
              plant('Mingxuan')
              assert find('#islandTitle').text=='Mingxuan 岛'
              assert compare(pixels(first),pixels(postcard()),'same named island')
              with tempfile.TemporaryDirectory() as folder:
                  w.until(lambda _:find('#saveCard').get_attribute('href').startswith('blob:') if find('#saveCard').get_attribute('href') else False)
                  settings={'behavior':'allow','downloadPath':folder}
                  browser_context=d.execute_cdp_cmd('Target.getTargetInfo',{})['targetInfo'].get('browserContextId')
                  if browser_context:settings['browserContextId']=browser_context
                  d.execute_cdp_cmd('Browser.setDownloadBehavior',settings)
                  d.execute_cdp_cmd('Page.setDownloadBehavior',{'behavior':'allow','downloadPath':folder})
                  assert find('#saveCard').get_attribute('download')=='island-Mingxuan.png'
                  click('#saveCard')
                  png=w.until(lambda _: next(iter(pathlib.Path(folder).glob('*.png')),None))
                  data=png.read_bytes()
                  assert data[:8]==bytes.fromhex('89504e470d0a1a0a') and struct.unpack('>II',data[16:24])==(1440,960)
                  assert png.name=='island-Mingxuan.png'
                  assert compare(pixels(first),Image.open(png).convert('RGB'),'exported postcard')
              print('PASS name reproducibility, different island and downloaded PNG',flush=True)
              d.get(home)
              click('a[data-art="typing"]')
              click('#language option[value="en"]')
              text=find('#sample').text
              find('#pad').send_keys(text)
              w.until(lambda _:'100%' in find('#stats').text and not find('#finish').is_enabled())
              print('PASS typing completion',flush=True)
              page('lake')
              for i in [2,1,3,4,5,6,7]: click('#marks button:nth-child('+str(i+1)+')')
              click('#fly')
              w.until(lambda _:d.find_elements(By.CSS_SELECTOR,'#gameSlot iframe'))
              d.switch_to.frame(find('#gameSlot iframe'))
              w.until(lambda _:d.execute_script("return typeof ready!=='undefined' && ready && playing && !!lap && shoreMarks[1].name==='THE NARROWS'"))
              print('PASS custom route imported into live flight',flush=True)
              d.switch_to.default_content()
              page('rps')
              for i in range(12): click('button[data-move="0"]')
              assert not find('button[data-move="0"]').is_enabled() and '结束' in find('#status').text
              print('PASS prediction match',flush=True)
              page('pelican')
              click('#start');click('[data-act="left"]');click('[data-act="jump"]')
              w.until(lambda _:d.execute_script("return lane===0 && meters>0"))
              click('#camera')
              w.until(lambda _:d.execute_script("return !!stream && document.getElementById('preview').readyState>=2"))
              click('#camera')
              assert d.execute_script('return stream===null')
              click('#pause')
              assert '已暂停' in find('#status').text
              print('PASS ride and local camera pipeline with a synthetic camera',flush=True)
              page('metro')
              click('#tick');assert '1 / 14' in find('#stats').text
              print('PASS trains departed',flush=True)
              page('paths')
              for node in [1,4,7]:
                  name=['码头','A','B','C','D','E','F','灯塔'][node]
                  b=next(e for e in d.find_elements(By.CSS_SELECTOR,'#next button') if e.text.startswith(name+' '))
                  b.click()
              assert 'Dijkstra' in find('#answer').text
              print('PASS completed route and cost comparison',flush=True)
          except Exception:
              print('PAGE',d.current_url,d.execute_script("return [document.readyState, document.querySelector('#frame')?.hidden,document.querySelector('#overview')?.hidden,document.querySelector('#reference')?.innerText,document.body.innerText.slice(0,280)]"),d.get_log('browser'),flush=True)
              raise
          finally:
              d.quit()
          PYTHON
