name: Verify public Pages release
on: [push]
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read the published homepage, driving scene and typeface
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          const files=[
            ['','36d717c1c2dae0d9ebda21d91f23995f778196a4'],
            ['drive/','771c809c8427b7b69f8b24837a82db4946f00784'],
            ['media/nightfall/lake-sans.woff2','b00756d0224979e089571ed06928e873919531a4'],
            ['media/nightfall/island.jpg','1bec104a3cdce25325637301504cb56e5619a797']
          ];
          for(let n=0;n<12;n++){
            const results=await Promise.all(files.map(async ([p,expected])=>{
              const res=await fetch('https://xuan0809999.github.io/'+p+'?v=57fbc2a619&check='+n,{cache:'no-store'});
              const bytes=Buffer.from(await res.arrayBuffer());
              const sha=createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');
              return {path:p||'/',status:res.status,expected,sha,ok:res.ok&&expected===sha};
            }));
            console.log(JSON.stringify(results));
            if(results.every(x=>x.ok))process.exit(0);
            await new Promise(resolve=>setTimeout(resolve,5500));
          }
          process.exit(1);
          JS
