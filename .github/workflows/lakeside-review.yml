name: Review the lakeside portfolio
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser tests
        run: npm install --prefix "$RUNNER_TEMP/lake-review" playwright-core@1.56.1 --no-audit --no-fund
      - name: Test navigation, instruments, driving and responsive layouts
        env:
          NODE_PATH: ${{ runner.temp }}/lake-review/node_modules
        run: |
          python3 -m http.server 8181 --bind 127.0.0.1 >/tmp/lake-site.log 2>&1 &
          node .github/checks/lakeside.cjs
      - name: Save visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lakeside-browser-review
          path: /tmp/lake-review-*.jpg
          if-no-files-found: ignore
